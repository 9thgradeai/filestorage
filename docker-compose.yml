services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-filestorage}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-filestorage}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-filestorage}
      # Auth
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a strong value (>= 32 chars)}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: 7
      BCRYPT_ROUNDS: 12
      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_FILE_BASE_URL: ${PUBLIC_FILE_BASE_URL:-http://localhost:3000}
      # AWS S3 (credentials are optional; IAM roles work on AWS)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-filestorage-bucket}
      # Uploads / limits
      MAX_FILE_SIZE: 104857600
      SHARE_LINK_EXPIRY_DAYS: 7
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side rewrite proxy → backend service (runtime env, no rebuild).
      API_BACKEND_URL: http://backend:5000
    ports:
      - '3000:3000'

volumes:
  pgdata: